plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xiao.clock'
    compileSdk 34

    defaultConfig {
        applicationId "com.xiao.clock"
        minSdk 14
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Zero external dependencies for maximum Android 4.0 (API 14) compatibility and ultra-small APK size
}
